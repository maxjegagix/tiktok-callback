<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Auth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #010101;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #121212;
            border: 1px solid #2f2f2f;
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #fe2c55;
        }
        p {
            color: #a9a9a9;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .code-box {
            background-color: #1e1e1e;
            border: 1px solid #3e3e3e;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            color: #25f4ee;
            word-break: break-all;
            margin-bottom: 20px;
            user-select: all;
        }
        .btn {
            background-color: #fe2c55;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        .btn:hover {
            background-color: #e0244d;
        }
        .error {
            color: #fe2c55;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Auth Callback</h1>
        <p id="status-text">Extracting authorization code...</p>
        <div id="code-container" style="display: none;">
            <div class="code-box" id="auth-code"></div>
            <button class="btn" onclick="copyCode()">Copy Code</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        const statusText = document.getElementById('status-text');
        const codeContainer = document.getElementById('code-container');
        const authCodeDiv = document.getElementById('auth-code');

        if (code) {
            statusText.innerText = "Authorization successful! Copy the code below and paste it into your terminal:";
            authCodeDiv.innerText = code;
            codeContainer.style.display = 'block';
        } else if (error) {
            statusText.innerHTML = `<span class="error">Error: ${error}</span><br>${errorDescription || ''}`;
        } else {
            statusText.innerText = "No authorization code found in the URL.";
        }

        function copyCode() {
            navigator.clipboard.writeText(authCodeDiv.innerText);
            alert("Code copied to clipboard!");
        }
    </script>
</body>
</html>
