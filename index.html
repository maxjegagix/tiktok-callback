<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Auth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #010101;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #121212;
            border: 1px solid #2f2f2f;
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #fe2c55;
        }
        p {
            color: #a9a9a9;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .code-box {
            background-color: #1e1e1e;
            border: 1px solid #3e3e3e;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            color: #25f4ee;
            word-break: break-all;
            margin-bottom: 20px;
            user-select: all;
        }
        .btn {
            background-color: #fe2c55;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        .btn:hover {
            background-color: #e0244d;
        }
        .error {
            color: #fe2c55;
            font-weight: bold;
        }
        .account-info {
            background-color: #1b1b1b;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: left;
        }
        .account-info h2 {
            font-size: 16px;
            margin: 0 0 6px 0;
            color: #25f4ee;
        }
        .account-info p {
            margin: 0;
            font-size: 13px;
            color: #b8b8b8;
        }
        .account-badge {
            display: inline-block;
            background-color: #fe2c55;
            color: white;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
        .terms-link {
            display: inline-block;
            margin-top: 16px;
            color: #25f4ee;
            text-decoration: none;
            font-size: 14px;
        }
        .terms-link:hover {
            text-decoration: underline;
        }
        .footer-links {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        @media (max-width: 480px) {
            body {
                padding: 16px;
                height: auto;
                align-items: flex-start;
            }
            .container {
                padding: 24px 18px;
                border-radius: 10px;
            }
            h1 {
                font-size: 20px;
            }
            .btn {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Auth Callback</h1>
        
        <div class="account-info">
            <h2>Target Akun TikTok:</h2>
            <p><strong>@regenerationintime</strong></p>
            <p style="margin-top: 4px;">Kategori: Entertainment & Hiburan</p>
            <span class="account-badge">Aktif</span>
        </div>

        <p id="status-text">Extracting authorization code...</p>
        <div id="code-container" style="display: none;">
            <div class="code-box" id="auth-code"></div>
            <button class="btn" onclick="copyCode()">Copy Code</button>
        </div>
        <div class="footer-links">
            <a class="terms-link" href="terms.html">Terms of Rules</a>
            <a class="terms-link" href="privacy.html">Privacy Policy</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        const statusText = document.getElementById('status-text');
        const codeContainer = document.getElementById('code-container');
        const authCodeDiv = document.getElementById('auth-code');

        if (code) {
            statusText.innerText = "Authorization successful! Copy the code below and paste it into your terminal:";
            authCodeDiv.innerText = code;
            codeContainer.style.display = 'block';
        } else if (error) {
            statusText.innerHTML = `<span class="error">Error: ${error}</span><br>${errorDescription || ''}`;
        } else {
            statusText.innerText = "No authorization code found in the URL.";
        }

        function copyCode() {
            navigator.clipboard.writeText(authCodeDiv.innerText);
            alert("Code copied to clipboard!");
        }
    </script>
</body>
</html>
